    <script type="application/ld+json">
    [
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "SakuDigital",
        "url": "https://sakudigital.com",
        "description": "Portal Offline Tools dan Alat Administrasi Gratis terlengkap untuk UMKM Indonesia, kepegawaian PNS, dan administrasi kantor.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "All",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "IDR"
        }
      },
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "Apa itu SakuDigital?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "SakuDigital adalah portal Offline Tools & Alat Administrasi Gratis serbaguna yang dirancang khusus untuk mempercepat transformasi digital UMKM Indonesia. Kami menyediakan 43+ alat produktivitas administrasi kantor, pengolahan media/gambar lokal, kalkulator bisnis UMKM, serta penunjang kebutuhan instansi daerah secara praktis."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah data saya aman saat diunggah atau diproses di SakuDigital?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Sangat aman! SakuDigital mengusung penuh konsep Offline Tools di mana seluruh pemrosesan berkas rahasia (seperti PDF, foto KTP, pasfoto CPNS, atau ijazah) diproses murni secara lokal langsung di dalam browser perangkat Anda. Tidak ada satu byte pun data yang dikirim ke server luar, bebas dari risiko kebocoran data."
            }
          },
          {
            "@type": "Question",
            "name": "Alat bisnis & UMKM apa saja yang tersedia di SakuDigital?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "SakuDigital menyediakan kalkulator potongan admin toko online (Shopee, Tokopedia, TikTok Shop, Lazada), kalkulator harga jual target profit, kalkulator HPP & BEP (balik modal), pembuat QR Code & Barcode kasir, pembuat Link Bio Brosur UMKM, serta Ekstraktor Foto Nota ke Excel (CSV) secara gratis."
            }
          },
          {
            "@type": "Question",
            "name": "Bagaimana cara menyalin hasil perhitungan atau generator teks?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Setiap output hasil kalkulasi, teks OCR, kode NIP, atau generator kalimat dilengkapi dengan 'Tombol Salin' (Copy Button) universal. Cukup klik satu kali, hasil teks akan langsung tersimpan di papan klip (clipboard) HP atau komputer Anda tanpa perlu memblok teks secara manual."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah ada alat untuk menghitung selamatan kematian adat Jawa?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tentu saja! Fitur 'Selamatan Kematian Jawa' kami dirancang untuk menghitung tanggal tahlilan/selamatan kematian secara otomatis, mulai dari 3 hari, 7 hari, 40 hari, 100 hari, Pendak pisan, Pendak pindo, hingga Nyewu (1000 hari). Anda bisa menyalin jadwal hasil hitungan tersebut atau langsung mencetak/menyimpannya dalam bentuk PDF secara instan."
            }
          },
          {
            "@type": "Question",
            "name": "Bagaimana cara mengamankan foto KTP agar terhindar dari penyalahgunaan?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Anda bisa menggunakan alat 'Watermark KTP' dan 'Sensor Redaktur KTP' di SakuDigital. Alat ini memungkinkan Anda memberikan cap air khusus (watermark) atau menutup/menyensor informasi sensitif seperti nomor NIK secara instan sebelum dikirim untuk verifikasi. Semuanya diproses 100% lokal tanpa khawatir bocor."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah ada alat untuk kompres file PDF dan konversi berkas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ya! Kami menyediakan alat 'Kompresor PDF Target 200KB/500KB' untuk membantu mengecilkan ukuran berkas pendaftaran kerja, CPNS, penggabung/pemecah PDF, serta konversi bolak-balik PDF ke Gambar JPG & Word."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah SakuDigital memiliki alat pengolahan gambar & video?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Lengkap! Tersedia pengubah format WebP ke JPG/PNG, kompresor video WA pas 16MB, pemotong video status WA per 30 detik, editor subtitle SRT/WebVTT, pembersih metadata foto (Exif Cleaner), pembuatan pasfoto CPNS & grid cetak A4, hingga penghapus background gambar otomatis."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah bisa mencetak label undangan pernikahan / acara kantor di SakuDigital?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Bisa! Kami menyediakan alat cetak label undangan presisi untuk ukuran kertas Label 103 (undangan umum) dan Label 121 (inventaris/kode barang). Anda bisa langsung mencetak hasil dari browser ke printer."
            }
          },
          {
            "@type": "Question",
            "name": "Bagaimana SakuDigital membantu pegawai negeri atau instansi kepegawaian?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Kami menyediakan berbagai utilitas perkantoran seperti 'Kalkulator Pensiun PNS' untuk mengetahui TMT pensiun dan sisa masa aktif kerja pegawai, generator nomor NIP otomatis, pemecah digit NIP, generator surat izin/lamaran, hingga pembuat tanda tangan digital transparan secara praktis."
            }
          },
          {
            "@type": "Question",
            "name": "Apakah SakuDigital benar-benar gratis selamanya?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Ya! Sebagai portal penyedia Alat Administrasi Gratis untuk membantu UMKM Indonesia dan administrasi kantor desa/instansi daerah, SakuDigital 100% gratis selamanya tanpa ada biaya berlangganan tersembunyi, tanpa daftar akun, serta bersih dari iklan yang mengganggu kenyamanan Anda."
            }
          },
          {
            "@type": "Question",
            "name": "Dapatkah SakuDigital dijalankan di HP / Smartphone?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Tentu saja! Aplikasi berbasis web Offline Tools ini dirancang fully responsive dengan pendekatan Mobile-First. Semua tombol, input, tabel hasil, serta tata letak teks telah dioptimalkan agar sangat nyaman dibaca, ramah di mata, serta mudah digunakan lewat layar sentuh HP Anda."
            }
          }
        ]
      }
    ]
